name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Terima lisensi Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cari folder proyek
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts tidak ditemukan. Isi repositori:"
            ls -R | head -80
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Proyek ada di: $(dirname "$f")"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa-scheduler-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Lampirkan ke GitHub Release (jika tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
